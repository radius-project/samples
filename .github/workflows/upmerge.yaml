---
name: Upmerge to edge

on:
  workflow_dispatch:

permissions: {}

jobs:
  upmerge:
    uses: radius-project/.github/.github/workflows/__upmerge.yml@main
    permissions:
      contents: read
    with:
      preserve-paths: |
        bicepconfig.json
    secrets:
      RADIUS_RELEASE_BOT_CLIENT_ID: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
      RADIUS_RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
