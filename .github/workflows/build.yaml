# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Build samples

on:
  workflow_dispatch:
  push:
    branches:
      - edge
      - v*.*
  pull_request:
    branches:
      - edge
      - v*.*
    paths:
      - samples/**
      - .github/workflows/build.yaml

permissions: {}

env:
  VERSION: latest
  CONTAINER_REGISTRY: ghcr.io/radius-project

jobs:
  build-ghcr:
    name: Build and push sample images to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: samples/demo/
            image: samples/demo
          - directory: samples/dapr/ui/
            image: samples/dapr-frontend
          - directory: samples/dapr/nodeapp/
            image: samples/dapr-backend
          - directory: samples/aws/
            image: samples/aws
          - directory: samples/aws-sqs/
            image: samples/aws-sqs
          - directory: samples/volumes/
            image: samples/volumes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.directory }}
          push: ${{ github.event_name == 'push' && true || false }}
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ matrix.image }}:${{ env.VERSION }}

  build-voting-app:
    name: Build and push voting app images to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VOTING_APP_REPOSITORY: dockersamples/example-voting-app
      # Update together with samples/local-aks-aci/images/voting-app.patch.
      VOTING_APP_REF: 63e9150ca17af4ed05880d4245e486481f73fcb4
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redis
            context: samples/local-aks-aci/images/redis/
          - name: vote
            context: example-voting-app/vote/
          - name: worker
            context: example-voting-app/worker/
          - name: result
            context: example-voting-app/result/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout voting app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.VOTING_APP_REPOSITORY }}
          ref: ${{ env.VOTING_APP_REF }}
          path: example-voting-app
          persist-credentials: false

      - name: Apply voting app patch
        run: git -C example-voting-app apply --verbose ../samples/local-aks-aci/images/voting-app.patch

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push samples/voting-app-${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          # images.lock.json pins one linux/amd64 manifest; a provenance attestation would wrap it in an index.
          provenance: false
          push: true # ${{ github.event_name == 'push' && true || false }}
          tags: ${{ env.CONTAINER_REGISTRY }}/samples/voting-app-${{ matrix.name }}:${{ env.VERSION }}

      - name: Report digest for images.lock.json
        # if: github.event_name == 'push'
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/samples/voting-app-${{ matrix.name }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -er .digest)"
          printf '"%s": "%s@%s"\n' "$NAME" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
